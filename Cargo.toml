[package]
name = "relic2077"
version = "0.1.0"
edition = "2024"
description = "A local-first, Git-native knowledge vault for every AI agent"
license = "MIT"
repository = "https://github.com/biociao/Relic2077"
homepage = "https://github.com/biociao/Relic2077"
documentation = "https://docs.rs/relic2077"
exclude = ["/.dsh", "/AGENTS.md"]

[[bin]]
name = "relic"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml_edit = "0.22"
uuid = { version = "1.11", features = ["v4"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"
