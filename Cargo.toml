[package]
name = "relic2077"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local-first, Git-native knowledge vault for every AI agent"
license = "MIT"
repository = "https://github.com/biociao/Relic2077"
homepage = "https://github.com/biociao/Relic2077"
documentation = "https://docs.rs/relic2077"
exclude = ["/.dsh", "/AGENTS.md"]

[[bin]]
name = "relic"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml_edit = "0.22"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
walkdir = "2.5"
sha2 = "0.10"
zstd = "0.13"
tempfile = "3.14"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
